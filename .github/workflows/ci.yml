name: release-smoke

on:
  push:
  pull_request:

jobs:
  cpu-release-gate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install lightweight test environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==1.25.0 pytest
          python -m pip install -e . --no-deps

      - name: Release-gate tests
        run: |
          python -m pytest -q \
            tests/dynamic_compute/test_release_gate.py \
            tests/dynamic_compute/test_release_smoke_summary.py

      - name: Syntax and package build
        run: |
          bash -n eval_libero.sh eval_libero_exit.sh train_libero.sh
          bash -n scripts/*.sh scripts/dynamic_compute/*.sh
          python -m py_compile \
            scripts/validate_phase_route_release.py \
            a1/vla/dynamic_compute/release.py \
            scripts/dynamic_compute/summarize_release_smoke.py
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir /tmp/wheel
